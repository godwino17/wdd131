<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Reviews</title>
    <meta name="author" content="Godwin Inyang">
    <meta name="description" content="Read our comprehensive product review page. We break down the key features, real-world performance, pros, cons, and verdict to help you decide.">

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form class="revf" method="get" action="review.html">

            <label for="selectproduct">Product Name</label>
            <select id="selectproduct" name="product" required>
                <option selected disabled value="">Select a Product...</option>
            </select>
        
            <div class="rating">
                <div>Overall Rating</div>
                <div class="radio">
                    <div>
                        <label for="one">&star;</label>
                        <input type="radio" id="one" name="star" value="1" required>
                    </div>
                   
                    <div>
                        <label for="two">&star; &star;</label>
                        <input type="radio" id="two" name="star" value="2" required>
                    </div>
                    
                    <div>
                        <label for="three">&star; &star; &star;</label>
                        <input type="radio" id="three" name="star" value="3" required>
                    </div>
                    
                    <div>
                        <label for="four">&star; &star; &star; &star;</label>
                        <input type="radio" id="four" name="star" value="4" required>
                    </div>
                    
                    <div>
                        <label for="five">&star; &star; &star; &star; &star;</label>
                        <input type="radio" id="five" name="star" value="5" required>
                    </div>
                </div>
            </div>
        
            <div class="date">
                <label for="date">Date of Installation</label>
                <input id="date" type="date" name="date" required>   
            </div>
        
            <div class="checkboxes">
                <div>Which features did you find useful in the product?</div>
                <div class="ita">(Check all that apply)</div>
                <div class="check">
                    <div>
                        <label for="duration">Durability</label>
                        <input type="checkbox" name="check" id="durable" value="durable">
                    </div>
                    
                    <div>
                        <label for="ease">Ease of Use</label>
                        <input type="checkbox" name="check" id="ease" value="ease">
                    </div>
                    
                    <div>
                        <label for="performance">Performance</label>
                        <input type="checkbox" name="check" id="performance" value="performance">
                    </div>
                    
                    <div>
                        <label for="design">Design</label>
                        <input type="checkbox" name="check" id="design" value="design">
                    </div>   
                </div>
            </div>
        
            <div>
                <label for="review">Written Review <span class="optional">(Optional)</span></label>
                <textarea id="review" name="review"></textarea>
            </div>
        
            <div>
                <label for="name">Your Name <span class="optional">(Optional)</span></label>
                <input type="text" id="name" name="fullname" placeholder="e.g Godwin Inyang">
            </div>
        
            <!-- Submit Button -->
            <input id="submit" type="submit" value="Post Review">
        </form>

    </main>

    <footer>
        <p>©<span id="year"></span> 🎈 By Godwin Inyang 🧍🏼‍♂️🎈 Nigeria</p>
        <p id="lastupdated"></p>
    </footer></body>
</html>
