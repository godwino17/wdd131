<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lazy Loading Example Demonstration</title>

    <link rel="stylesheet" href="styles/lazyload.css">
    <script src="scripts/lazyload.js" defer></script>
</head>
<body>
    <header><h1>Lazy Loading of Images Demonstration</h1></header>
    
    <main>
        <img src="images/image1.jpg" alt="Tea, Tea cup, Teapot image" loading="lazy" width="400" height="600">
        <img src="images/image2.jpg" alt="Monk, Orange robe, Meditation image" loading="lazy" width="400" height="700">
        <img src="images/image3.jpg" alt="forest, Sequoia, Trees image" loading="lazy" width="400" height="800">
        <img src="images/image4.jpg" alt="Deer, Wildlife, Nature image" loading="lazy" width="400" height="650">
        <img src="images/image5.jpg" alt="Portrait, Figure, Stylish royalty-free stock illustration" loading="lazy" width="400" height="750">
        <img src="images/image6.jpg" alt="Chamomile, Beautiful flowers, Flower background image" loading="lazy" width="400" height="600">
    </main>

    <footer>
        <p>Checking out the effectiveness of lazy loading images on a page.</p>
        <p id="lastupdated"></p>
    </footer>
</body>
</html>
